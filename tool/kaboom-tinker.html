<!DOCTYPE html>
<html>
<head>
    <title> Kaboom Tinkering </title>
</head>
<body>
        <script type="module">

    // import kaboom.js
    import kaboom from "https://unpkg.com/kaboom@3000.0.1/dist/kaboom.mjs";     

    // adds blank canvas 
    kaboom();

    // add text

    add ([
        pos(100,150),
        rect(80,50),
        color(255,0,0),
        area(),
    ])

    loadSprite("coin", "https://kaboomjs.com/sprites/coin.png")
    loadSprite("bean", "https://kaboomjs.com/sprites/bean.png")
    loadSprite("key", "https://kaboomjs.com/sprites/key.png")
    loadSprite("door", "https://kaboomjs.com/sprites/door.png")


    addLevel ([
        '        ',
        '        ',
        '        ',
        '        ',
        '        ',
        '        ',
        '      @ @ @ $ -',
        'xxxxxxxxxxxxxxxxxxxxx',
    ], {
         tileWidth: 80,
         tileHeight: 40,
         tiles: {
        'x' : () => [
        rect(80,50),
        color(0, 128, 0),
        area (), 
        body({ isStatic: true }),
        ],

        '@': () => [
            sprite("coin"),
            area(),
            "coin",
        ],

        "$": () => [
				sprite("key"),
				area(),
				"key",
         ],

         "-": () => [
            sprite("door"),
            area(),
            "door",
         ],
    }
})


const player = add([
    sprite("bean"),
    pos(80, 40),
    area(),
    body(),
])

setGravity(1600);

onKeyPress("space", () => {
    player.jump()
})

const SPEED = 200;

onKeyDown("left", () => {
    player.move(-SPEED, 0);
})

onKeyDown("right", () => {
    player.move(SPEED, 0);
})

player.onCollide("coin", (coin) => {
		destroy(coin)
}) 

let hasKey = false

player.onCollide("key", (key) => {
    destroy(key)
    hasKey = true
})

player.onCollide("door", (door) => {
    if (hasKey === true) {
     const woohoo = add([
        text("Door Unlocked!!"),
        pos(120, 80),
     ])
    }
})

   
</script>
</body>
</html>
